# Render reads this file to create the web service from GitHub.
# The API keys are NOT here: Render asks for them when you create the service
# and keeps them secret. Free-plan scans use GEMINI_API_KEY; Pro and Business use
# OPENAI_API_KEY. Set both.
services:
  - type: web
    name: ai-viral-product-finder
    runtime: python
    plan: free
    # server.py only uses Python's standard library - nothing to install.
    buildCommand: echo "No dependencies to install"
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
